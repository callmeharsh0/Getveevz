<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Character Filmstrip</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      background: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000000;
    }

    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .stage {
      --pointer-x: 50%;
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 440px;
      overflow: hidden;
      isolation: isolate;
      perspective: 1450px;
      cursor: ew-resize;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px) 50% 0 / 25% 100%,
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 109px,
          rgba(255, 255, 255, 0.025) 110px,
          transparent 111px
        ),
        radial-gradient(circle at var(--pointer-x) 48%, rgba(255, 255, 255, 0.07), transparent 38%),
        #000000;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.15;
      background:
        repeating-radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.08) 0 0.5px, transparent 0.7px 4px),
        repeating-radial-gradient(circle at 78% 71%, rgba(255, 255, 255, 0.08) 0 0.5px, transparent 0.8px 5px);
      mix-blend-mode: screen;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0.85),
        transparent 14%,
        transparent 86%,
        rgba(0, 0, 0, 0.85)
      );
    }

    .deck {
      position: absolute;
      inset: 0;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .card {
      --focus: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(160px, 17.5vw, 240px);
      aspect-ratio: 9 / 16;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, calc(0.12 + var(--focus) * 0.28));
      border-radius: 16px;
      color: #ffffff;
      background: #08080a;
      box-shadow:
        0 calc(12px + var(--focus) * 28px) calc(24px + var(--focus) * 44px)
          rgba(0, 0, 0, calc(0.65 + var(--focus) * 0.3)),
        inset 0 0 0 1px rgba(255, 255, 255, calc(0.06 + var(--focus) * 0.16));
      appearance: none;
      outline: none;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, calc(0.05 + var(--focus) * 0.15));
      pointer-events: none;
    }

    .card:focus-visible {
      box-shadow:
        0 26px 50px rgba(0, 0, 0, 0.8),
        0 0 0 4px rgba(255, 255, 255, 0.4);
    }

    .portrait {
      position: absolute;
      inset: 0;
      border-radius: 15px;
      overflow: hidden;
      background: #000000;
    }

    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.15) 0%,
        transparent 25%,
        transparent 58%,
        rgba(0, 0, 0, 0.82) 100%
      );
      pointer-events: none;
    }

    .portrait img,
    .portrait video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(calc(1.02 + (1 - var(--focus)) * 0.05));
      filter:
        saturate(calc(0.8 + var(--focus) * 0.3))
        contrast(1.05);
    }

    .views-badge {
      position: absolute;
      bottom: clamp(12px, 1.4vw, 18px);
      left: 50%;
      z-index: 10;
      transform: translateX(-50%) scale(calc(0.92 + var(--focus) * 0.12));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: clamp(6px, 0.75vw, 8px) clamp(11px, 1.1vw, 16px);
      border-radius: 9999px;
      background: rgba(9, 14, 20, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, calc(0.18 + var(--focus) * 0.28));
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      pointer-events: none;
      white-space: nowrap;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .views-icon {
      width: clamp(12px, 1.1vw, 15px);
      height: clamp(12px, 1.1vw, 15px);
      color: #8ba3c5;
      flex-shrink: 0;
    }

    .views-text {
      color: #ffffff;
      font-family: ui-monospace, "SFMono-Regular", "Menlo", monospace;
      font-size: clamp(9px, 0.85vw, 12px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 650px) {
      .stage {
        min-height: 560px;
        cursor: ns-resize;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px) 50% 0 / 50% 100%,
          repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 87px,
            rgba(255, 255, 255, 0.025) 88px,
            transparent 89px
          ),
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.07), transparent 38%),
          #000000;
      }

      .card {
        width: clamp(138px, 42vw, 175px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        will-change: auto;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Interactive editorial character filmstrip">
    <h1 class="sr-only">Character Filmstrip</h1>
    <p class="sr-only">Move your pointer or use the arrow keys to browse the portraits.</p>
    <div class="deck" id="deck" data-testid="filmstrip"></div>
  </main>

  <script>
    (() => {
      const media = {
        reel1: "/assets/Reels/New/reel-1.mp4",
        reel2: "/assets/Reels/New/reel-2.mp4",
        reel3: "/assets/Reels/New/reel-3.mp4",
        reel4: "/assets/Reels/New/reel-4.mp4",
        reel5: "/assets/Reels/New/reel-5.mp4",
        reel6: "/assets/Reels/New/reel-6.mp4",
        reel7: "/assets/Reels/New/reel-7.mp4",
        reel8: "/assets/Reels/New/reel-8.mp4",
        reel9: "/assets/Reels/New/reel-9.mp4"
      };

      const profiles = [
        ["Knowledge · 4 Books That Change Your Life", "4.2M VIEWS", "reel1"],
        ["DraperTV · Future of Payment", "2.8M VIEWS", "reel2"],
        ["DraperTV · Healthcare Innovation", "5.1M VIEWS", "reel3"],
        ["Nikhil Kamath · Tanmay Bhat Take", "6.4M VIEWS", "reel4"],
        ["3 Books You Need To Read", "3.9M VIEWS", "reel5"],
        ["Founders · Billion Dollar Startup vs College", "7.2M VIEWS", "reel6"],
        ["Real Life Tech · Not AI", "3.1M VIEWS", "reel7"],
        ["DraperTV · The Chemo Chip", "4.7M VIEWS", "reel8"],
        ["Viral Podcast Master Cut", "5.8M VIEWS", "reel9"]
      ].map(([name, role, portrait]) => ({ name, role, portrait }));

      const stage = document.querySelector("#stage");
      const deck = document.querySelector("#deck");
      const cards = profiles.map((profile, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.index = String(index);
        card.setAttribute("aria-label", `Reel with ${profile.role}`);
        card.innerHTML = `
          <span class="portrait">
            <video data-media src="${media[profile.portrait]}" muted loop playsinline preload="metadata" aria-hidden="true"></video>
          </span>
          <span class="views-badge">
            <svg class="views-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span class="views-text">${profile.role}</span>
          </span>`;
        deck.append(card);
        return card;
      });

      const count = cards.length;
      const videos = cards.map((card) => card.querySelector("video[data-media]"));
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        phase: 4,
        target: 4,
        base: 4,
        pointerX: 0,
        pointerY: 0,
        active: false,
        lastInput: performance.now()
      };

      function wrappedDelta(index, phase) {
        let delta = index - phase;
        while (delta > count / 2) delta -= count;
        while (delta < -count / 2) delta += count;
        return delta;
      }

      function nearestIndex() {
        return (Math.round(state.phase) % count + count) % count;
      }

      function moveTo(index) {
        const current = nearestIndex();
        let delta = index - current;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        state.base += delta;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }

      cards.forEach((card, index) => {
        card.addEventListener("click", () => moveTo(index));
        card.addEventListener("focus", () => moveTo(index));
      });

      stage.addEventListener("pointermove", (event) => {
        const rect = stage.getBoundingClientRect();
        const nx = Math.max(-1, Math.min(1, ((event.clientX - rect.left) / rect.width - 0.5) * 2));
        const ny = Math.max(-1, Math.min(1, ((event.clientY - rect.top) / rect.height - 0.5) * 2));
        state.pointerX = nx;
        state.pointerY = ny;
        state.active = true;
        state.target = state.base + (innerWidth < 650 ? ny * 2.2 : nx * 3.1);
        state.lastInput = performance.now();
        stage.style.setProperty("--pointer-x", `${(nx + 1) * 50}%`);
      });

      stage.addEventListener("pointerleave", () => {
        state.active = false;
        state.pointerX = 0;
        state.pointerY = 0;
        state.target = state.base;
        stage.style.setProperty("--pointer-x", "50%");
      });

      stage.addEventListener("wheel", (event) => {
        // Scroll-to-advance disabled: let the page scroll naturally through this section.
        // Pointer drag and arrow-key navigation still work below.
      }, { passive: true });

      function nextReel() {
        state.base += 1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }

      function prevReel() {
        state.base -= 1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      }

      window.nextReel = nextReel;
      window.prevReel = prevReel;

      window.addEventListener("message", (event) => {
        if (event.data === "filmstrip:next") {
          nextReel();
        } else if (event.data === "filmstrip:prev") {
          prevReel();
        }
      });

      addEventListener("keydown", (event) => {
        const forward = event.key === "ArrowRight" || event.key === "ArrowDown";
        const backward = event.key === "ArrowLeft" || event.key === "ArrowUp";
        if (!forward && !backward) return;
        event.preventDefault();
        state.base += forward ? 1 : -1;
        state.target = state.base;
        state.active = false;
        state.lastInput = performance.now();
      });

      let previousTime = performance.now();

      function render(time) {
        const deltaTime = Math.min(32, time - previousTime);
        previousTime = time;
        const ease = reducedMotion ? 1 : 1 - Math.pow(0.001, deltaTime / 1000);

        if (!state.active && time - state.lastInput > 3600) {
          const idle = time - state.lastInput - 3600;
          state.target = state.base + Math.sin(idle * 0.00042) * 2.45;
        }

        state.phase += (state.target - state.phase) * ease;
        const compact = innerWidth < 650;
        const activeIndex = nearestIndex();

        // Play only the focused card's video; pause all others. Respect reduced-motion.
        for (let i = 0; i < videos.length; i++) {
          const video = videos[i];
          if (!video) continue;
          if (i === activeIndex && !reducedMotion) {
            if (video.paused) video.play().catch(() => { });
          } else if (!video.paused) {
            video.pause();
          }
        }

        const horizontalSpacing = Math.min(168, Math.max(112, innerWidth * 0.116));
        const verticalSpacing = Math.min(122, Math.max(88, innerHeight * 0.112));

        cards.forEach((card, index) => {
          const delta = wrappedDelta(index, state.phase);
          const distance = Math.abs(delta);
          const focus = Math.exp(-distance * distance * 1.28);
          const side = Math.max(0, 1 - distance / 5);
          const direction = Math.sign(delta);
          const x = compact
            ? delta * 24 + Math.sin(delta * 0.9) * 25
            : delta * horizontalSpacing;
          const y = compact
            ? delta * verticalSpacing
            : distance * 8 + state.pointerY * focus * 10;
          const z = focus * 145 - distance * 148;
          const scale = 0.54 + side * 0.15 + focus * 0.54;
          const rotateX = compact ? delta * 2.1 : -state.pointerY * focus * 3.5;
          const rotateY = compact
            ? -delta * 5
            : -direction * (distance > 0.2 ? 14 + Math.min(distance, 3) * 5 : 0) + state.pointerX * focus * 3;
          const rotateZ = compact ? delta * -1.4 : delta * 0.7;

          card.style.setProperty("--focus", focus.toFixed(4));
          card.style.zIndex = String(Math.round(1000 - distance * 100));
          card.style.opacity = String(Math.max(0.13, side * 0.76 + focus * 0.24));
          card.style.filter = `blur(${Math.max(0, distance - 1.5) * 0.38}px)`;
          card.style.transform = [
            "translate(-50%, -50%)",
            `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, ${z.toFixed(2)}px)`,
            `rotateX(${rotateX.toFixed(2)}deg)`,
            `rotateY(${rotateY.toFixed(2)}deg)`,
            `rotateZ(${rotateZ.toFixed(2)}deg)`,
            `scale(${scale.toFixed(4)})`
          ].join(" ");
          card.setAttribute("aria-current", index === activeIndex ? "true" : "false");
        });

        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
